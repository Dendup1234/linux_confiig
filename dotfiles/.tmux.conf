# Keep tmux's normal prefix.
set -g prefix C-b
unbind C-b
bind C-b send-prefix

# Display the tmux window list (tabs) at the top.
set -g status on
set -g status-position top
set -g status-interval 5
set -g status-left " #[bold]#S "
set -g status-right " %Y-%m-%d %H:%M "
set -g status-left-length 30
set -g status-right-length 40

# Number windows from 1 and close numbering gaps automatically.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Tab appearance.
setw -g window-status-format " #[fg=colour244]#I:#W "
setw -g window-status-current-format "#[fg=colour231,bg=colour33,bold] #I:#W #[default]"

# Switch windows directly, without pressing the tmux prefix first.
# Note: Ctrl+number support depends on the terminal emulator.
bind-key -n C-1 select-window -t 1
bind-key -n C-2 select-window -t 2
bind-key -n C-3 select-window -t 3
bind-key -n C-4 select-window -t 4
bind-key -n C-5 select-window -t 5
bind-key -n C-6 select-window -t 6
bind-key -n C-7 select-window -t 7
bind-key -n C-8 select-window -t 8
bind-key -n C-9 select-window -t 9

# Reliable fallback supported by most terminals: Alt+1 through Alt+9.
bind-key -n M-1 select-window -t 1
bind-key -n M-2 select-window -t 2
bind-key -n M-3 select-window -t 3
bind-key -n M-4 select-window -t 4
bind-key -n M-5 select-window -t 5
bind-key -n M-6 select-window -t 6
bind-key -n M-7 select-window -t 7
bind-key -n M-8 select-window -t 8
bind-key -n M-9 select-window -t 9
bind-key -n M-0 select-window -t 0

# Convenient window management.
bind-key -n C-S-Enter new-window
bind-key -n M-Left previous-window
bind-key -n M-Right next-window

# Reload this file with prefix + r.
bind r source-file ~/.tmux.conf \; display-message "tmux configuration reloaded"

# General usability.
set -g mouse on
set -g history-limit 100000
set -g set-clipboard on
set -g focus-events on
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
run-shell ~/.tmux/plugins/tmux-resurrect/resurrect.tmux


# Refresh display vars from the client on attach (fixes stale WAYLAND_DISPLAY).
set -ga update-environment " WAYLAND_DISPLAY HYPRLAND_INSTANCE_SIGNATURE"
